const c=document.getElementById('map'),ctx=c.getContext('2d');
const terrain=new Image();terrain.src=assets.terrain;const landmarks=assets.landmarks.map(src=>{const i=new Image();i.src=src;return i;});
const routes=[[0,1,3],[2,3,4,5],[0,2,1,4]];let route=routes[0],time=0,paused=false,last=0;
const pause=document.getElementById('pause');pause.onclick=()=>{paused=!paused;pause.textContent=paused?'继续动效':'暂停动效';pause.setAttribute('aria-pressed',String(paused));};
document.getElementById('route').onchange=e=>{route=routes[+e.target.value];time=0;};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function line(a,b,color,width){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();}
function draw(now){if(last&&!paused)time+=Math.min(.05,(now-last)/1000)*Number(document.getElementById('speed').value);last=now;
ctx.clearRect(0,0,c.width,c.height);if(terrain.complete)ctx.drawImage(terrain,0,0);
for(const road of layout.roads){const a=layout.nodes[road.from].pixel_anchor,b=layout.nodes[road.to].pixel_anchor;ctx.setLineDash(road.kind==='gravel'?[16,18]:[]);line(a,b,'#49605d',7);}ctx.setLineDash([]);
for(let k=0;k<route.length-1;k++)line(layout.nodes[route[k]].pixel_anchor,layout.nodes[route[k+1]].pixel_anchor,'#efae58',9);
const segment=Math.floor(time/4)%(route.length-1),t=(time%4)/4,a=layout.nodes[route[segment]].pixel_anchor,b=layout.nodes[route[segment+1]].pixel_anchor,pos=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
for(let k=0;k<segment;k++)line(layout.nodes[route[k]].pixel_anchor,layout.nodes[route[k+1]].pixel_anchor,'#80cfb3',9);line(a,pos,'#80cfb3',9);
layout.nodes.forEach((n,i)=>{const [x,y]=n.pixel_anchor;const im=landmarks[i];if(im.complete)ctx.drawImage(im,x-128*.86,y-216*.86,256*.86,256*.86);ctx.fillStyle='#80cfb3';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.font='26px system-ui';ctx.fillStyle='#ffedc9';ctx.textAlign='center';ctx.fillText(n.id+' · '+n.label_cn,x,y+53);});
const r=29+(reduced?0:Math.sin(time*3)*3.35);ctx.beginPath();ctx.arc(...pos,r,0,Math.PI*2);ctx.fillStyle='rgba(128,207,179,.18)';ctx.fill();ctx.beginPath();ctx.arc(...pos,15.65,0,Math.PI*2);ctx.fillStyle='#80cfb3';ctx.fill();requestAnimationFrame(draw);}
requestAnimationFrame(draw);
